<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yachiyo Bubble</title>
    <link rel="stylesheet" href="../shared/theme/yachiyo-theme.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
        font-family: var(--y-font);
      }

      #bubble {
        opacity: 0;
        transform: translateY(10px) scale(0.982);
        transition: opacity 140ms ease-out, transform 140ms cubic-bezier(0.22, 0.86, 0.28, 1);
        position: absolute;
        left: 0;
        top: 0;
        color: var(--y-ink);
        background: var(--y-surface-strong);
        border: 1px solid var(--y-gold-line);
        backdrop-filter: blur(var(--y-glass-blur)) saturate(1.12);
        border-radius: var(--y-radius-l);
        padding: 10px 14px;
        line-height: 1.45;
        font-size: 16px;
        box-shadow: 0 18px 42px rgba(3, 4, 15, 0.34), inset 0 1px rgba(255,255,255,.035);
        overflow: hidden;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        display: flex;
        align-items: stretch;
        /* Fade the top 5% of the bubble into transparency. */
        -webkit-mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 1) 5%,
          rgba(0, 0, 0, 1) 100%
        );
        mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 1) 5%,
          rgba(0, 0, 0, 1) 100%
        );
      }

      #bubble-lines {
        margin-top: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 4px;
        overflow: hidden;
      }

      #bubble-open-chat {
        display: none;
        position: absolute;
        right: 12px;
        bottom: 9px;
        height: 26px;
        padding: 0 10px;
        pointer-events: auto;
        border: 1px solid var(--y-line-strong);
        border-radius: var(--y-radius-pill);
        background: var(--y-surface-hover);
        color: var(--y-gold);
        cursor: pointer;
        white-space: nowrap;
      }
      #bubble.truncated #bubble-lines { padding-bottom: 32px; }
      #bubble.truncated #bubble-open-chat { display: block; }

      #bubble.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      #bubble.pop-in {
        animation: bubblePopIn 120ms cubic-bezier(0.2, 0.88, 0.2, 1);
      }

      .bubble-line {
        white-space: nowrap;
        overflow: hidden;
        line-height: 1.45;
        flex: 0 0 auto;
        opacity: 1;
        transform: translateY(0);
        transition: opacity 110ms ease, transform 110ms ease;
      }

      .bubble-line.line-enter {
        opacity: 0;
        transform: translateY(6px);
      }

      .bubble-line.line-exit {
        opacity: 0;
        transform: translateY(-4px);
      }

      @keyframes bubblePopIn {
        0% {
          transform: translateY(10px) scale(0.972);
        }
        70% {
          transform: translateY(0) scale(1.006);
        }
        100% {
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="bubble">
      <div id="bubble-lines"></div>
      <button id="bubble-open-chat" type="button">在聊天中查看</button>
    </div>
    <script src="./bubblePresentation.js"></script>
    <script src="./bubble.js"></script>
  </body>
</html>
