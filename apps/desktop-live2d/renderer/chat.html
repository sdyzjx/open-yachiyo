<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>八千代</title>
    <link rel="stylesheet" href="../shared/theme/yachiyo-theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--y-bg); color: var(--y-ink); font-family: var(--y-font); }
      button, select, textarea { font: inherit; }
      button { white-space: nowrap; }
      #chat-panel { position: relative; display: flex; width: 100%; height: 100%; flex-direction: column; background: var(--y-grad-night); }
      #chat-panel::before { position: absolute; inset: 0; pointer-events: none; content: ""; background: radial-gradient(circle at 86% 8%, color-mix(in srgb, var(--y-accent) 12%, transparent), transparent 34%); }
      #chat-panel-header { position: relative; z-index: 2; display: flex; min-height: 68px; align-items: center; gap: var(--y-sp-3); padding: 14px 14px 10px 84px; border-bottom: 1px solid var(--y-line); background: var(--y-surface); -webkit-app-region: drag; }
      .chat-brand { display: flex; min-width: 116px; align-items: center; gap: var(--y-sp-2); }
      .chat-avatar { display: grid; width: 34px; height: 34px; flex: none; place-items: center; border: 1px solid var(--y-gold-line); border-radius: 50%; background: var(--y-surface-hover); color: var(--y-gold); box-shadow: var(--y-glow); font-size: var(--y-fs-s); }
      .chat-brand-copy { display: grid; min-width: 0; gap: 3px; }
      #chat-panel-header-title { color: var(--y-gold); font-size: var(--y-fs-m); font-weight: 650; letter-spacing: .08em; }
      .chat-presence { display: flex; align-items: center; gap: 5px; color: var(--y-ink-dim); font-size: var(--y-fs-xs); }
      .chat-presence-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--y-good); box-shadow: 0 0 10px var(--y-good); }
      .chat-toolbar { display: flex; min-width: 0; flex: 1; align-items: center; justify-content: flex-end; gap: 6px; -webkit-app-region: no-drag; }
      .toolbar-select { min-width: 88px; max-width: 142px; height: 32px; border: 1px solid var(--y-line-strong); border-radius: var(--y-radius-pill); outline: none; background: var(--y-surface-strong); color: var(--y-ink); padding: 0 26px 0 10px; font-size: var(--y-fs-xs); }
      .toolbar-select:focus { border-color: var(--y-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--y-accent) 18%, transparent); }
      .toolbar-select:disabled { opacity: .45; }
      .toolbar-icon { width: 32px; padding: 0; font-size: var(--y-fs-m); }
      #transfer-wrap { position: relative; display: flex; align-items: center; gap: 5px; }
      #transfer-select { max-width: 104px; }
      #transfer-select[hidden] { display: none; }
      #transfer-status { position: absolute; top: 38px; right: 0; width: max-content; max-width: 240px; padding: 6px 9px; border: 1px solid var(--y-line); border-radius: var(--y-radius-s); background: var(--y-surface-strong); color: var(--y-ink-dim); box-shadow: var(--y-shadow-soft); font-size: var(--y-fs-xs); }
      #transfer-status:empty { display: none; }
      #chat-panel-messages { position: relative; z-index: 1; display: flex; flex: 1 1 auto; flex-direction: column; gap: var(--y-sp-3); min-height: 0; padding: var(--y-sp-4); overflow: auto; scroll-behavior: smooth; }
      .chat-message { max-width: 88%; padding: 10px 12px; border: 1px solid var(--y-line); border-radius: var(--y-radius-m); background: var(--y-surface); box-shadow: var(--y-shadow-soft); font-size: var(--y-fs-m); line-height: 1.55; overflow-wrap: anywhere; animation: message-in var(--y-dur-fast) var(--y-ease-out); }
      .chat-message.user { align-self: flex-end; background: color-mix(in srgb, var(--y-accent) 18%, var(--y-surface)); border-color: color-mix(in srgb, var(--y-accent) 34%, var(--y-line)); }
      .chat-message.assistant { align-self: flex-start; }
      .chat-message.system, .chat-message.tool { align-self: stretch; max-width: 100%; color: var(--y-ink-dim); font-size: var(--y-fs-s); }
      .chat-message p { margin: 4px 0; }
      .chat-message h1, .chat-message h2, .chat-message h3 { margin: 9px 0 5px; line-height: 1.3; }
      .chat-message h1 { font-size: var(--y-fs-l); } .chat-message h2 { font-size: var(--y-fs-m); } .chat-message h3 { font-size: var(--y-fs-s); }
      .chat-message pre { max-width: 100%; padding: 10px; overflow: auto; border-radius: var(--y-radius-s); background: var(--y-bg); }
      .chat-message code { font-family: var(--y-font-mono); }
      .chat-message a { color: var(--y-accent); }
      .chat-message table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
      .chat-message th, .chat-message td { padding: 5px 7px; border: 1px solid var(--y-line); }
      .chat-message blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--y-accent); color: var(--y-ink-dim); }
      .chat-message-images { display: flex; flex-wrap: wrap; gap: var(--y-sp-2); margin-top: var(--y-sp-2); }
      .chat-image-card, .chat-image-chip { overflow: hidden; border: 1px solid var(--y-line); border-radius: var(--y-radius-s); background: var(--y-bg-2); color: var(--y-ink); cursor: pointer; text-align: left; }
      .chat-image-card { width: 148px; padding: 0; } .chat-image-thumb { display: grid; width: 100%; height: 92px; place-items: center; object-fit: cover; background: var(--y-surface); } .chat-image-meta { padding: 6px 8px; overflow: hidden; font-size: var(--y-fs-xs); text-overflow: ellipsis; white-space: nowrap; }
      .chat-image-chip { padding: 5px 8px; }
      .chat-streaming-body::after { display: inline-block; width: 6px; height: 12px; margin-left: 4px; background: var(--y-accent); content: ""; animation: blink 800ms infinite; }
      .mermaid-diagram { max-width: 100%; overflow: auto; }
      #chat-panel-composer { position: relative; z-index: 2; display: flex; flex: 0 0 auto; flex-direction: column; gap: var(--y-sp-2); padding: 10px 12px 12px; border-top: 1px solid var(--y-line); background: var(--y-surface); }
      #chat-composer-input-row { display: flex; align-items: flex-end; gap: var(--y-sp-2); }
      #chat-input { flex: 1; min-width: 0; min-height: 56px; max-height: 132px; resize: none; overflow-y: hidden; }
      #chat-image-pick { width: 40px; flex: none; padding: 0; font-size: var(--y-fs-l); }
      #chat-send { flex: none; }
      #chat-image-input { display: none; }
      #chat-upload-preview { display: flex; max-height: 104px; flex-direction: column; gap: 5px; overflow: auto; }
      .chat-upload-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--y-line); border-radius: var(--y-radius-s); background: var(--y-bg-2); }
      .chat-upload-thumb { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; } .chat-upload-meta { min-width: 0; flex: 1; } .chat-upload-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .chat-upload-size { color: var(--y-ink-dim); font-size: var(--y-fs-xs); }
      .chat-upload-remove { border: 0; background: transparent; color: var(--y-ink-dim); cursor: pointer; }
      @keyframes message-in { from { opacity: 0; transform: translateY(8px); } }
      @keyframes blink { 50% { opacity: .2; } }
      @media (max-width: 520px) { #chat-panel-header { min-height: 104px; flex-wrap: wrap; padding-right: 9px; } .chat-brand { min-width: 150px; } .chat-toolbar { flex: 0 0 calc(100% + 70px); justify-content: flex-start; margin-left: -70px; gap: 4px; } .toolbar-select { max-width: 110px; } .y-btn { padding: 0 9px; } #transfer-button { padding: 0 8px; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' });
      window.mermaid = mermaid;
    </script>
  </head>
  <body>
    <main id="chat-panel">
      <header id="chat-panel-header">
        <div class="chat-brand"><span class="chat-avatar" aria-hidden="true">八</span><span class="chat-brand-copy"><span id="chat-panel-header-title">八千代</span><span class="chat-presence"><span class="chat-presence-dot"></span><span id="presence-label">在电脑上</span></span></span></div>
        <div class="chat-toolbar">
          <select id="model-active" class="toolbar-select" aria-label="对话模型" title="选择对话模型"><option>正在读取模型…</option></select>
          <div id="transfer-wrap"><select id="transfer-select" class="toolbar-select" aria-label="选择手机" hidden></select><button id="transfer-button" class="y-btn" type="button">送到手机</button><span id="transfer-status" role="status" aria-live="polite"></span></div>
          <button id="new-chat" class="y-btn toolbar-icon" type="button" title="新对话" aria-label="新对话">＋</button>
          <button id="open-webui" class="y-btn toolbar-icon" type="button" title="设置" aria-label="设置">⚙</button>
        </div>
      </header>
      <section id="chat-panel-messages" class="y-scroll" aria-live="polite"></section>
      <footer id="chat-panel-composer">
        <div id="chat-upload-preview" class="y-scroll"></div>
        <div id="chat-composer-input-row"><button id="chat-image-pick" class="y-btn" type="button" title="添加图片" aria-label="添加图片">＋</button><textarea id="chat-input" class="y-input" maxlength="4000" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea><button id="chat-send" class="y-btn y-btn--primary" type="button">发送</button></div>
        <input id="chat-image-input" type="file" accept="image/*" multiple />
      </footer>
    </main>
    <script src="./desktopChatState.js"></script>
    <script src="./chat.js"></script>
  </body>
</html>
