<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>八千代</title>
    <link rel="stylesheet" href="../shared/theme/yachiyo-theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--y-bg); color: var(--y-ink); font-family: var(--y-font); }
      button, select, textarea { font: inherit; }
      button { white-space: nowrap; }
      #chat-panel { position: relative; display: flex; width: 100%; height: 100%; flex-direction: column; background: var(--y-grad-night); }
      #chat-panel::before { position: absolute; inset: 0; pointer-events: none; content: ""; background: radial-gradient(circle at 86% 8%, color-mix(in srgb, var(--y-accent) 12%, transparent), transparent 34%); }
      #chat-panel-header { position: relative; z-index: 2; display: flex; min-height: 108px; flex: none; flex-direction: column; gap: 10px; padding: 12px; border-bottom: 1px solid var(--y-line); background: var(--y-surface); -webkit-app-region: drag; }
      .chat-title-row { display: flex; width: 100%; min-width: 0; min-height: 42px; align-items: center; padding-left: 72px; }
      .chat-brand { display: flex; min-width: 0; align-items: center; gap: 10px; }
      .chat-avatar { display: grid; width: 34px; height: 34px; flex: none; place-items: center; border: 1px solid var(--y-gold-line); border-radius: 50%; background: var(--y-surface-hover); color: var(--y-gold); box-shadow: var(--y-glow); font-size: var(--y-fs-s); }
      .chat-brand-copy { display: grid; min-width: 0; gap: 3px; }
      #chat-panel-header-title { color: var(--y-gold); font-size: var(--y-fs-m); font-weight: 650; letter-spacing: .08em; }
      .chat-presence { display: flex; align-items: center; gap: 5px; color: var(--y-ink-dim); font-size: var(--y-fs-xs); }
      .chat-presence-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--y-good); box-shadow: 0 0 10px var(--y-good); }
      .chat-toolbar { display: flex; width: 100%; min-width: 0; align-items: center; gap: 8px; -webkit-app-region: no-drag; }
      .model-control { min-width: 0; flex: 1 1 180px; }
      .toolbar-actions { display: flex; min-width: 0; flex: none; align-items: center; gap: 8px; }
      .toolbar-select { min-width: 0; height: 32px; border: 1px solid var(--y-line-strong); border-radius: var(--y-radius-pill); outline: none; background: var(--y-surface-strong); color: var(--y-ink); padding: 0 28px 0 11px; font-size: var(--y-fs-xs); text-overflow: ellipsis; white-space: nowrap; }
      #model-active { width: 100%; }
      .toolbar-select:focus { border-color: var(--y-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--y-accent) 18%, transparent); }
      .toolbar-select:disabled { opacity: .45; }
      .toolbar-icon { width: 32px; height: 32px; flex: 0 0 32px; padding: 0; font-size: var(--y-fs-m); }
      #session-control-toggle { position: relative; }
      #session-approval-count { position: absolute; top: -5px; right: -5px; display: grid; min-width: 16px; height: 16px; place-items: center; padding: 0 4px; border: 1px solid var(--y-bg); border-radius: 9px; background: var(--y-bad); color: #fff; font-size: 9px; font-weight: 700; }
      #session-approval-count[hidden] { display: none; }
      #transfer-wrap { display: flex; min-width: 0; align-items: center; gap: 8px; }
      #transfer-select { width: 88px; }
      #transfer-select[hidden] { display: none; }
      #transfer-button { height: 32px; }
      .visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
      #chat-workspace { position: relative; z-index: 1; display: flex; flex: 1 1 auto; min-height: 0; }
      #chat-session-sidebar { width: 190px; flex: 0 0 190px; display: flex; min-height: 0; flex-direction: column; border-right: 1px solid var(--y-line); background: color-mix(in srgb, var(--y-surface) 72%, transparent); }
      .chat-session-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 13px 12px 9px; color: var(--y-ink-dim); font-size: var(--y-fs-xs); letter-spacing: .08em; }
      #chat-session-new { width: 28px; height: 28px; padding: 0; }
      #chat-session-list { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 5px; padding: 0 8px 12px; overflow-y: auto; }
      .chat-session-item { width: 100%; padding: 9px 10px; border: 1px solid transparent; border-radius: 12px; background: transparent; color: var(--y-ink-dim); cursor: pointer; text-align: left; }
      .chat-session-item:hover { background: var(--y-surface-hover); color: var(--y-ink); }
      .chat-session-item.active { border-color: var(--y-gold-line); background: linear-gradient(135deg, rgba(182,161,255,.2), rgba(239,208,157,.08)); color: var(--y-ink); }
      .chat-session-title { display: block; overflow: hidden; font-size: var(--y-fs-xs); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
      .chat-session-meta { display: block; margin-top: 4px; color: var(--y-ink-faint); font-size: 10px; }
      #chat-session-empty { padding: 18px 10px; color: var(--y-ink-faint); font-size: var(--y-fs-xs); text-align: center; }
      #chat-panel-messages { position: relative; display: flex; flex: 1 1 auto; flex-direction: column; gap: var(--y-sp-3); min-width: 0; min-height: 0; padding: var(--y-sp-4); overflow: auto; scroll-behavior: smooth; }
      .chat-message-row { display: flex; width: 100%; align-items: flex-end; gap: 8px; }
      .chat-message-row.user { justify-content: flex-end; }
      .chat-message-row.system, .chat-message-row.tool { display: block; }
      .chat-message-avatar { display: grid; width: 26px; height: 26px; flex: 0 0 26px; place-items: center; margin-bottom: 3px; border: 1px solid var(--y-gold-line); border-radius: 50%; background: var(--y-surface-hover); color: var(--y-gold); box-shadow: var(--y-glow); font-size: 10px; }
      .chat-message { max-width: 78%; padding: 10px 12px 7px; border: 1px solid var(--y-line); border-radius: var(--y-radius-m); background: var(--y-surface); box-shadow: var(--y-shadow-soft); font-size: var(--y-fs-m); line-height: 1.55; overflow-wrap: anywhere; animation: message-in var(--y-dur-fast) var(--y-ease-out); }
      .chat-message.user { background: color-mix(in srgb, var(--y-accent) 18%, var(--y-surface)); border-color: color-mix(in srgb, var(--y-accent) 34%, var(--y-line)); }
      .chat-message.system, .chat-message.tool { max-width: 100%; color: var(--y-ink-dim); font-size: var(--y-fs-s); }
      .chat-message-time { display: block; margin-top: 3px; color: var(--y-ink-dim); font-size: 10px; line-height: 1.2; opacity: 0; text-align: right; transition: opacity var(--y-dur-fast) var(--y-ease-out); }
      .chat-message-row:hover .chat-message-time, .chat-message-row:focus-within .chat-message-time { opacity: .8; }
      .chat-message p { margin: 4px 0; }
      .chat-message h1, .chat-message h2, .chat-message h3 { margin: 9px 0 5px; line-height: 1.3; }
      .chat-message h1 { font-size: var(--y-fs-l); } .chat-message h2 { font-size: var(--y-fs-m); } .chat-message h3 { font-size: var(--y-fs-s); }
      .chat-message pre { max-width: 100%; padding: 10px; overflow: auto; border-radius: var(--y-radius-s); background: var(--y-bg); }
      .chat-message code { font-family: var(--y-font-mono); }
      .chat-message a { color: var(--y-accent); }
      .chat-message table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
      .chat-message th, .chat-message td { padding: 5px 7px; border: 1px solid var(--y-line); }
      .chat-message blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--y-accent); color: var(--y-ink-dim); }
      .chat-message-images { display: flex; flex-wrap: wrap; gap: var(--y-sp-2); margin-top: var(--y-sp-2); }
      .chat-image-card, .chat-image-chip { overflow: hidden; border: 1px solid var(--y-line); border-radius: var(--y-radius-s); background: var(--y-bg-2); color: var(--y-ink); cursor: pointer; text-align: left; }
      .chat-image-card { width: 148px; padding: 0; } .chat-image-thumb { display: grid; width: 100%; height: 92px; place-items: center; object-fit: cover; background: var(--y-surface); } .chat-image-meta { padding: 6px 8px; overflow: hidden; font-size: var(--y-fs-xs); text-overflow: ellipsis; white-space: nowrap; }
      .chat-image-chip { padding: 5px 8px; }
      .chat-streaming-body::after { display: inline-block; width: 6px; height: 12px; margin-left: 4px; background: var(--y-accent); content: ""; animation: blink 800ms infinite; }
      .mermaid-diagram { max-width: 100%; overflow: auto; }
      #chat-panel-composer { position: relative; z-index: 2; display: flex; flex: 0 0 auto; flex-direction: column; gap: var(--y-sp-2); padding: 10px 12px 12px; border-top: 1px solid var(--y-line); background: var(--y-surface); }
      #chat-composer-input-row { display: flex; align-items: center; gap: var(--y-sp-2); }
      #chat-input { flex: 1; min-width: 0; min-height: 42px; max-height: 142px; resize: none; overflow-y: hidden; line-height: 21px; }
      #chat-image-pick { width: 40px; flex: none; padding: 0; font-size: var(--y-fs-l); }
      #chat-mic { width: 40px; flex: none; padding: 0; font-size: var(--y-fs-m); }
      #chat-mic.recording { border-color: rgba(255,112,137,.75); background: rgba(190,54,83,.34); color: #fff; box-shadow: 0 0 0 3px rgba(255,92,125,.13); }
      #chat-mic.sending { opacity: .7; cursor: wait; }
      #chat-send { min-width: 58px; flex: none; }
      #chat-send:disabled { border-color: var(--y-line-strong); background: var(--y-surface-hover); color: var(--y-ink-dim); box-shadow: none; opacity: .78; }
      #chat-image-input { display: none; }
      #chat-upload-preview { display: flex; max-height: 104px; flex-direction: column; gap: 5px; overflow: auto; }
      .chat-upload-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--y-line); border-radius: var(--y-radius-s); background: var(--y-bg-2); }
      .chat-upload-thumb { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; } .chat-upload-meta { min-width: 0; flex: 1; } .chat-upload-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .chat-upload-size { color: var(--y-ink-dim); font-size: var(--y-fs-xs); }
      .chat-upload-remove { border: 0; background: transparent; color: var(--y-ink-dim); cursor: pointer; }
      #session-control-panel { position: absolute; z-index: 5; top: 116px; right: 12px; width: min(390px, calc(100% - 24px)); max-height: calc(100% - 132px); padding: 16px; overflow: auto; border: 1px solid var(--y-gold-line); border-radius: 22px; background: linear-gradient(155deg, rgba(35,32,71,.91), rgba(10,12,31,.94) 66%, rgba(30,22,49,.92)); box-shadow: 0 24px 70px rgba(2,3,14,.55), inset 0 1px rgba(255,255,255,.08); backdrop-filter: blur(28px) saturate(1.3); -webkit-backdrop-filter: blur(28px) saturate(1.3); -webkit-app-region: no-drag; }
      #session-control-panel[hidden] { display: none; }
      .session-control-head, .session-pending-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .session-control-head h2 { margin: 0; color: var(--y-gold); font-size: var(--y-fs-m); font-weight: 650; letter-spacing: .05em; }
      .session-control-head span, .session-pending-head span { color: var(--y-ink-dim); font-size: var(--y-fs-xs); }
      .session-mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 14px; padding: 5px; border: 1px solid var(--y-line); border-radius: 15px; background: rgba(3,4,16,.35); }
      .session-mode-grid button { min-width: 0; min-height: 38px; padding: 6px; border: 0; border-radius: 11px; background: transparent; color: var(--y-ink-dim); cursor: pointer; font-size: var(--y-fs-xs); }
      .session-mode-grid button[aria-checked="true"] { background: linear-gradient(135deg, rgba(182,161,255,.25), rgba(239,208,157,.12)); color: var(--y-ink); box-shadow: inset 0 0 0 1px var(--y-gold-line); }
      .session-mode-grid button:disabled { opacity: .5; cursor: default; }
      #session-mode-description { min-height: 36px; margin: 9px 3px 16px; color: var(--y-ink-dim); font-size: var(--y-fs-xs); line-height: 1.5; }
      .session-pending-head { margin: 0 2px 8px; }
      #session-pending-list { display: grid; gap: 8px; }
      .session-approval-card { padding: 11px; border: 1px solid var(--y-line); border-radius: 14px; background: rgba(238,230,255,.055); }
      .session-approval-tool { color: var(--y-gold); font-size: 10px; font-weight: 700; letter-spacing: .1em; }
      .session-approval-command { margin: 6px 0; padding: 8px 9px; overflow-wrap: anywhere; border-radius: 9px; background: rgba(2,3,14,.42); font: 11px/1.45 var(--y-font-mono); user-select: text; }
      .session-approval-reason { color: var(--y-ink-dim); font-size: var(--y-fs-xs); }
      .session-approval-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 9px; }
      .session-approval-actions button { min-width: 62px; padding: 7px 10px; border: 1px solid var(--y-line); border-radius: var(--y-radius-pill); background: var(--y-surface-hover); color: var(--y-ink); cursor: pointer; font-size: var(--y-fs-xs); }
      .session-approval-actions .approve { border-color: var(--y-gold-line); background: var(--y-grad-primary); color: var(--y-accent-ink); }
      #session-approval-empty { margin: 18px 0 4px; color: var(--y-ink-dim); font-size: var(--y-fs-xs); text-align: center; }
      #session-approval-empty[hidden] { display: none; }
      #chat-tool-activity { position: absolute; z-index: 4; top: 120px; right: 14px; display: flex; width: min(300px, calc(100% - 28px)); max-height: 42%; flex-direction: column; gap: 7px; overflow-y: auto; pointer-events: none; }
      #chat-tool-activity:empty { display: none; }
      .chat-tool-card { padding: 10px 12px; border: 1px solid var(--y-line); border-radius: 14px; background: color-mix(in srgb, var(--y-surface-strong) 94%, transparent); box-shadow: var(--y-shadow); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); pointer-events: auto; animation: message-in var(--y-dur-fast) var(--y-ease-out); }
      .chat-tool-card.running { border-color: var(--y-accent); } .chat-tool-card.done { border-color: var(--y-good); } .chat-tool-card.failed { border-color: var(--y-bad); }
      .chat-tool-name { overflow: hidden; font-size: var(--y-fs-xs); font-weight: 650; text-overflow: ellipsis; white-space: nowrap; } .chat-tool-status { margin-top: 3px; color: var(--y-ink-dim); font-size: 10px; }
      @keyframes message-in { from { opacity: 0; transform: translateY(8px); } }
      @keyframes blink { 50% { opacity: .2; } }
      @media (max-width: 620px) { #chat-session-sidebar { width: 146px; flex-basis: 146px; } }
      @media (max-width: 440px) { #chat-session-sidebar { width: 112px; flex-basis: 112px; } .chat-session-head { padding-inline: 8px; } #chat-session-list { padding-inline: 5px; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' });
      window.mermaid = mermaid;
    </script>
  </head>
  <body>
    <main id="chat-panel">
      <header id="chat-panel-header">
        <div class="chat-title-row"><div class="chat-brand"><span class="chat-avatar" aria-hidden="true">八</span><span class="chat-brand-copy"><span id="chat-panel-header-title">八千代</span><span class="chat-presence"><span class="chat-presence-dot"></span><span id="presence-label">在电脑上</span></span></span></div></div>
        <div class="chat-toolbar">
          <div class="model-control"><select id="model-active" class="toolbar-select" aria-label="对话模型" title="选择对话模型"><option>正在读取模型…</option></select></div>
          <div class="toolbar-actions"><button id="session-control-toggle" class="y-btn toolbar-icon" type="button" title="执行权限" aria-label="执行权限" aria-expanded="false">♢<span id="session-approval-count" hidden>0</span></button><div id="transfer-wrap"><select id="transfer-select" class="toolbar-select" aria-label="选择手机" hidden></select><button id="transfer-button" class="y-btn" type="button">送到手机</button><span id="transfer-status" class="visually-hidden" role="status" aria-live="polite"></span></div><button id="new-chat" class="y-btn toolbar-icon" type="button" title="新对话" aria-label="新对话">＋</button><button id="open-webui" class="y-btn toolbar-icon" type="button" title="设置" aria-label="设置">⚙</button></div>
        </div>
      </header>
      <aside id="session-control-panel" aria-label="执行权限" hidden>
        <div class="session-control-head"><h2>执行权限</h2><span id="session-control-session">尚未同步</span></div>
        <div class="session-mode-grid" role="radiogroup" aria-label="会话执行权限"><button type="button" data-session-mode="manual" role="radio">每次询问</button><button type="button" data-session-mode="auto_approve" role="radio">自动批准</button><button type="button" data-session-mode="full_access" role="radio">完全访问</button></div>
        <p id="session-mode-description"></p>
        <div class="session-pending-head"><strong>待处理请求</strong><span id="session-control-status">正在同步…</span></div>
        <div id="session-pending-list"></div>
        <p id="session-approval-empty">当前没有等待处理的请求</p>
      </aside>
      <aside id="chat-tool-activity" aria-label="工具执行记录" aria-live="polite"></aside>
      <div id="chat-workspace">
        <aside id="chat-session-sidebar" aria-label="聊天会话">
          <div class="chat-session-head"><strong>会话</strong><button id="chat-session-new" class="y-btn" type="button" title="新对话" aria-label="新对话">＋</button></div>
          <div id="chat-session-list" class="y-scroll"></div>
          <p id="chat-session-empty">暂无历史对话</p>
        </aside>
        <section id="chat-panel-messages" class="y-scroll" aria-live="polite"></section>
      </div>
      <footer id="chat-panel-composer">
        <div id="chat-upload-preview" class="y-scroll"></div>
        <div id="chat-composer-input-row"><button id="chat-image-pick" class="y-btn" type="button" title="添加图片" aria-label="添加图片">＋</button><button id="chat-mic" class="y-btn" type="button" title="开始录音" aria-label="开始录音">🎙</button><textarea id="chat-input" class="y-input" maxlength="4000" rows="1" placeholder="对八千代说点什么…"></textarea><button id="chat-send" class="y-btn y-btn--primary" type="button">发送</button></div>
        <input id="chat-image-input" type="file" accept="image/*" multiple />
      </footer>
    </main>
    <script src="./desktopChatState.js"></script>
    <script src="./chat.js"></script>
  </body>
</html>
